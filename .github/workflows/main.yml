name: Java Build and Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Debug repo structure (safe to keep or remove later)
      - name: Debug repository structure
        run: |
          pwd
          ls
          ls "DevOps Project-01"

      # 3. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Give execute permission to mvnw
      - name: Grant execute permission to mvnw
        working-directory: "DevOps Project-01/Java-Login-App"
        run: chmod +x mvnw

      # 5. Build application using Maven Wrapper
      - name: Build with Maven
        working-directory: "DevOps Project-01/Java-Login-App"
        run: mvn clean package -DskipTests
        
      # 5.1. Verify jar file
      - name: Verify JAR file exists
        run: |
         echo "Listing target directory:"
         ls "DevOps Project-01/Java-Login-App/target"
         echo "Finding all JAR files:"
         find . -type f -name "*.jar"

      # 6. Copy JAR to Azure VM
      - name: Copy JAR to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "DevOps Project-01/Java-Login-App/target/*.jar"
          target: ${{ secrets.AZURE_APP_DIR }}

      # 7. Run application on Azure VM
      - name: Run application on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            pkill -f java || true
            nohup java -jar ${{ secrets.AZURE_APP_DIR }}/*.jar > app.log 2>&1 &
