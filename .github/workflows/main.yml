name: Build and Deploy Java WAR to Azure VM (Tomcat)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Debug repository structure
      - name: Debug repository structure 
        run: |
          pwd
          ls
          ls "DevOps Project-01"

      # 3. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Build WAR using Maven
      - name: Build with Maven
        working-directory: "DevOps Project-01/Java-Login-App"
        run: mvn clean package -DskipTests

      # 5. Verify WAR file exists
      - name: Verify WAR file exists
        run: |
          echo "Listing target directory:"
          ls "DevOps Project-01/Java-Login-App/target"
          echo "Finding WAR files:"
          find . -type f -name "*.war"

      # 6. Copy WAR to Azure VM
      - name: Copy WAR to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "DevOps Project-01/Java-Login-App/target/*.war"
          target: ${{ secrets.AZURE_APP_DIR }}

      # 7. Deploy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            sudo cp ${{ secrets.AZURE_APP_DIR }}/*.war /var/lib/tomcat9/webapps/
            sudo systemctl restart tomcat9
